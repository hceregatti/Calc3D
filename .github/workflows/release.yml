# Gera o instalador .dmg do app macOS e publica no GitHub Releases
# sempre que uma tag "v*" (ex.: v1.0.0) é enviada.
name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Gera o .app e o .dmg
        run: ./scripts/build-dmg.sh
      - name: Publica no Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DMG="$(ls build/*.dmg)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "Calc3D $TAG" --generate-notes
          fi
