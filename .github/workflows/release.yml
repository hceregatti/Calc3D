# Gera o instalador .dmg do app macOS e publica no GitHub Releases
# sempre que uma tag "v*" (ex.: v1.0.0) é enviada.
name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do Release a (re)publicar, ex.: v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Gera o .app e o .dmg
        run: ./scripts/build-dmg.sh
      - name: Publica no Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          DMG="$(ls build/Calc3D-*.dmg)"
          # Cópia com nome fixo: releases/latest/download/Calc3D.dmg sempre aponta para a última versão.
          cp "$DMG" build/Calc3D.dmg
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" build/Calc3D.dmg --clobber
          else
            gh release create "$TAG" "$DMG" build/Calc3D.dmg --title "Calc3D $TAG" --generate-notes
          fi
